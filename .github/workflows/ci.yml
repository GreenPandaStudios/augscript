name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run version:check
      - run: node --test tests/release-publication.test.mjs
      - run: npm run check
      - run: npm run docs:check
      - name: Require documentation with behavior changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-doc-change.mjs "$BASE_SHA"
      - run: npm run docs:build
      - run: npm run package:packages
      - run: npm --prefix vscode ci --ignore-scripts
      - run: npm --prefix vscode audit --audit-level=moderate
      - run: npm run package:extension
      - run: node scripts/release-artifacts.mjs
      - name: Verify npm and Marketplace release artifacts without publishing
        run: |
          node scripts/publish-release.mjs dist/release --verify-only
          node scripts/publish-extension.mjs dist/release --verify-only
      - run: node scripts/bootstrap-native.mjs --extract-only --only minicoro,yyjson
      - run: npm run test:packages
  native:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      AUG_LLVM_HOME: ${{ github.workspace }}/.aug-build/llvm-tools
      AUG_GITHUB_TOKEN: ${{ github.token }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .aug-native/downloads
          key: native-downloads-${{ hashFiles('scripts/native-dependencies.lock.json') }}
      - run: npm ci
      - run: npm --prefix vscode ci
      - run: npm --prefix vscode audit --audit-level=moderate
      - run: node scripts/bootstrap-native.mjs
      - run: node scripts/prepare-llvm-tools.mjs
      - run: node scripts/build-runtime-pack.mjs
      - run: npm run check
      - run: npm test
      - name: Existing language, runtime and real applications through LLVM
        run: node scripts/check-llvm-parity.mjs
      - run: npm run test:setup-cold
      - run: npm run test:sanitizers
      - run: node scripts/build-llvm-pack.mjs
      - run: npm run package:packages
      - run: npm run package:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-consumer-inputs
          include-hidden-files: true
          path: |
            dist/release/*.tgz
            dist/release/packages.json
            .aug-build/aug-llvm-macos-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-preview
          path: vscode/*.vsix
          if-no-files-found: error
  native-consumer-macos14:
    needs: native
    runs-on: macos-14
    timeout-minutes: 20
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-consumer-inputs
          path: .
      - name: Require the advertised minimum platform
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import {release} from "node:os"; assert.equal(process.arch,"arm64"); assert.equal(Number(release().split(".")[0]),23);'
      - name: Remove developer tools from the disposable consumer runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /Applications/Xcode*.app /Library/Developer/CommandLineTools
          test -z "$(command -v clang || true)" || ! clang --version
          ! xcrun --show-sdk-path
      - name: Qualify installed CLI and public library downloads with native tools unavailable
        run: node scripts/qualify-native-consumers.mjs --local-compiler
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-consumer-macos14-evidence
          include-hidden-files: true
          path: .aug-build/native-consumer-qualification.json
          if-no-files-found: error
  docker-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile.build -t augscript/build:local .
      - run: docker run --rm --entrypoint sh augscript/build:local -lc 'cd /opt/augscript && npm test'
      - run: docker run --rm --entrypoint sh augscript/build:local -lc 'cd /opt/augscript && npm run test:sanitizers'
      - run: docker build -f docker/Dockerfile.run -t augscript/run:local .
      - run: docker build -f docker/Dockerfile.smoke -t augscript/smoke:local .
      - run: test "$(docker run --rm augscript/smoke:local)" = "Hello, August!"
      - run: docker build -f docker/Dockerfile.crypto-smoke -t augscript/crypto-smoke:local .
      - run: test "$(docker run --rm augscript/crypto-smoke:local)" = "ungWv48Bz-pBQUDeXa4iI7ADYaOWF3qctBD_YfIAFa0"
      - run: docker build -f docker/Dockerfile.web-smoke -t augscript/web-smoke:local .
      - name: Serve typed HTTP from the runtime image
        run: |
          container=$(docker run -d -p 127.0.0.1::8080 augscript/web-smoke:local)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port=$(docker port "$container" 8080/tcp)
          test "$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 "http://$port/health")" = '{"status":"ok"}'
