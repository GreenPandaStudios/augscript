name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reliability_profile:
        description: Runtime lifecycle duration; soak runs for at least 30 minutes
        type: choice
        options: [soak, ci]
        default: soak
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run version:check
      - run: node --test tests/release-publication.test.mjs
      - run: npm run check
      - run: npm run docs:check
      - run: npm run qualification:render -- --check
      - name: Require documentation with behavior changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-doc-change.mjs "$BASE_SHA"
      - run: npm run docs:build
      - run: npm run package:packages
      - run: npm --prefix vscode ci --ignore-scripts
      - run: npm --prefix vscode audit --audit-level=moderate
      - run: npm run package:extension
      - run: node scripts/release-artifacts.mjs
      - name: Verify npm and Marketplace release artifacts without publishing
        run: |
          node scripts/publish-release.mjs dist/release --verify-only
          node scripts/publish-extension.mjs dist/release --verify-only
      - run: node scripts/bootstrap-native.mjs --extract-only --only minicoro,yyjson
      - run: npm run test:packages
  native:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AUG_LLVM_HOME: ${{ github.workspace }}/.aug-build/llvm-tools
      AUG_GITHUB_TOKEN: ${{ github.token }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .aug-native/downloads
          key: native-downloads-${{ hashFiles('scripts/native-dependencies.lock.json') }}
      - run: npm ci
      - run: npm --prefix vscode ci
      - run: npm --prefix vscode audit --audit-level=moderate
      - run: node scripts/bootstrap-native.mjs
      - run: node scripts/prepare-llvm-tools.mjs
      - run: node scripts/prepare-llvm-maintainer.mjs
      - run: node scripts/build-runtime-pack.mjs
      - run: npm run check
      - run: npm test
      - name: Independent language conformance in both LLVM modes and block styles
        run: npm run test:conformance
      - name: Check isolated workers under native race and memory instrumentation
        run: |
          AUG_WORKER_SANITIZER=thread node --test tests/worker-runtime.test.mjs
          AUG_WORKER_SANITIZER=address,undefined node --test tests/worker-runtime.test.mjs
      - name: Qualify repeated runtime lifecycles and sustained heap use
        env:
          AUG_SANITIZER_CC: ${{ github.workspace }}/.aug-build/llvm-maintainer/bin/clang
          RELIABILITY_PROFILE: ${{ inputs.reliability_profile || 'ci' }}
        run: npm run test:reliability -- --profile "$RELIABILITY_PROFILE"
      - name: Existing language, runtime and real applications through LLVM
        env:
          AUG_REQUIRE_DWARF: '1'
          AUG_REQUIRE_DEBUGGER: '1'
        run: node scripts/check-llvm-parity.mjs
      - run: npm run test:setup-cold
      - run: npm run test:sanitizers
      - run: npm run test:safety
      - name: Instrument LLVM programs and the core runtime
        env:
          AUG_SANITIZER_CC: ${{ github.workspace }}/.aug-build/llvm-maintainer/bin/clang
        run: node scripts/sanitize-core.mjs --backend llvm
      - run: node scripts/build-llvm-pack.mjs
      - name: Qualify the native PostgreSQL package and HTTP drain
        run: |
          git clone --no-checkout https://github.com/GreenPandaStudios/aug-postgres "$RUNNER_TEMP/aug-postgres"
          git -C "$RUNNER_TEMP/aug-postgres" checkout --detach 40b0a671f7c9066fe6b311d931020749949e3f60
          node bin/aug.mjs bind header "$RUNNER_TEMP/aug-postgres/native/include/aug_postgres.h" --contract "$RUNNER_TEMP/aug-postgres/native.abi.json" --target aarch64-apple-darwin --clang clang --output .aug-build/header-check-postgres
          node "$RUNNER_TEMP/aug-postgres/native/build.mjs"
          AUG_CLI="$PWD/bin/aug.mjs" AUG_RUNTIME_PACK="$PWD/.aug-native/llvm/runtime" AUG_NATIVE_HOME="$PWD/.aug-native" node "$RUNNER_TEMP/aug-postgres/native/ci-server.mjs"
      - name: Retain PostgreSQL artifact and qualification identities
        if: always()
        run: |
          mkdir -p .aug-build/postgres-evidence
          for file in candidate.json qualification.json; do
            if test -f "$RUNNER_TEMP/aug-postgres/.aug-build/native/$file"; then
              cp "$RUNNER_TEMP/aug-postgres/.aug-build/native/$file" .aug-build/postgres-evidence/
            fi
          done
      - name: Qualify LLVM performance against the C reference
        run: |
          node scripts/benchmark-suite.mjs --backend llvm --compare-c-backend --iterations 60 --warmup 3 --http-rounds 5 --http-requests 5000 --output .aug-build/llvm-migration-performance.json
          node scripts/check-llvm-performance.mjs .aug-build/llvm-migration-performance.json
      - name: Qualify generated safety gyms and expanded C comparisons
        env:
          AUG_SANITIZER_CC: ${{ github.workspace }}/.aug-build/llvm-maintainer/bin/clang
        run: |
          node scripts/run-gyms.mjs --profile full --vectors 256
          node scripts/benchmark-kernels.mjs --iterations 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: llvm-macos-performance
          include-hidden-files: true
          path: |
            .aug-build/runtime-reliability/
            .aug-build/language-conformance.json
            .aug-build/postgres-evidence/
            .aug-build/llvm-migration-performance.json
            .aug-build/kernels/results.json
            .aug-build/gyms/results.json
          if-no-files-found: error
      - run: npm run package:packages
      - run: npm run package:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-consumer-inputs
          include-hidden-files: true
          path: |
            dist/release/*.tgz
            dist/release/packages.json
            .aug-build/aug-llvm-macos-arm64.tar.gz
            .aug-build/compiler-pack-darwin-arm64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-preview
          path: vscode/*.vsix
          if-no-files-found: error
  native-consumer-macos14:
    needs: native
    runs-on: macos-14
    timeout-minutes: 20
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-consumer-inputs
          path: .
      - name: Require the advertised minimum platform
        run: node --input-type=module -e 'import assert from "node:assert/strict"; import {release} from "node:os"; assert.equal(process.arch,"arm64"); assert.equal(Number(release().split(".")[0]),23);'
      - name: Remove developer tools from the disposable consumer runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /Applications/Xcode*.app /Library/Developer/CommandLineTools
          test -z "$(command -v clang || true)" || ! clang --version
          ! xcrun --show-sdk-path
      - name: Qualify installed CLI and public library downloads with native tools unavailable
        run: |
          node scripts/qualify-native-consumers.mjs --local-compiler
          node scripts/qualify-workers.mjs --local-compiler
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-consumer-macos14-evidence
          include-hidden-files: true
          path: |
            .aug-build/native-consumer-qualification.json
            .aug-build/worker-consumer-qualification.json
          if-no-files-found: error
  docker-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile.compiler-tests -t augscript/compiler-tests:local .
      - run: docker run --rm -e AUG_GITHUB_TOKEN --entrypoint sh augscript/compiler-tests:local -lc 'cd /opt/augscript && npm test'
      - run: docker run --rm --entrypoint sh augscript/compiler-tests:local -lc 'cd /opt/augscript && npm run test:sanitizers'
      - run: docker run --rm -e AUG_GITHUB_TOKEN --entrypoint sh augscript/compiler-tests:local -lc 'cd /opt/augscript && npm run test:safety'
