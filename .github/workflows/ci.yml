name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run version:check
      - run: npm run check
      - run: npm run docs:check
      - name: Require documentation with behavior changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-doc-change.mjs "$BASE_SHA"
      - run: npm run docs:build
      - run: npm run package:packages
      - run: node scripts/bootstrap-native.mjs --extract-only --only minicoro,yyjson
      - run: npm run test:packages
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .aug-native/downloads
          key: native-downloads-${{ hashFiles('scripts/native-dependencies.lock.json') }}
      - run: npm ci
      - run: npm --prefix vscode ci
      - run: npm --prefix vscode audit --audit-level=moderate
      - run: node scripts/bootstrap-native.mjs
      - run: npm run check
      - run: npm test
      - run: npm run test:sanitizers
      - run: npm run package:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-preview
          path: vscode/*.vsix
          if-no-files-found: error
  docker-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile.build -t augscript/build:local .
      - run: docker run --rm --entrypoint sh augscript/build:local -lc 'cd /opt/augscript && npm test'
      - run: docker run --rm --entrypoint sh augscript/build:local -lc 'cd /opt/augscript && npm run test:sanitizers'
      - run: docker build -f docker/Dockerfile.run -t augscript/run:local .
      - run: docker build -f docker/Dockerfile.smoke -t augscript/smoke:local .
      - run: test "$(docker run --rm augscript/smoke:local)" = "Hello, August!"
      - run: docker build -f docker/Dockerfile.crypto-smoke -t augscript/crypto-smoke:local .
      - run: test "$(docker run --rm augscript/crypto-smoke:local)" = "ungWv48Bz-pBQUDeXa4iI7ADYaOWF3qctBD_YfIAFa0"
      - run: docker build -f docker/Dockerfile.web-smoke -t augscript/web-smoke:local .
      - name: Serve typed HTTP from the runtime image
        run: |
          container=$(docker run -d -p 127.0.0.1::8080 augscript/web-smoke:local)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port=$(docker port "$container" 8080/tcp)
          test "$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 "http://$port/health")" = '{"status":"ok"}'
