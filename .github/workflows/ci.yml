name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: npm run docs:check
      - name: Require documentation with behavior changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-doc-change.mjs "$BASE_SHA"
      - run: npm run docs:build
      - run: npm run package:packages
      - run: node scripts/bootstrap-native.mjs --extract-only --only minicoro,yyjson
      - run: npm run test:packages
  native:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .aug-native/downloads
          key: native-downloads-${{ hashFiles('scripts/native-dependencies.lock.json') }}
      - run: npm ci
      - run: npm --prefix vscode ci
      - run: node scripts/bootstrap-native.mjs
      - run: npm run check
      - run: npm test
      - run: npm run package:extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-preview
          path: vscode/*.vsix
          if-no-files-found: error
