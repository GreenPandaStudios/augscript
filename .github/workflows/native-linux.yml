name: LLVM GNU/Linux qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reliability_profile:
        description: Runtime lifecycle duration; soak runs for at least 30 minutes
        type: choice
        options: [soak, ci]
        default: soak
permissions:
  contents: read
concurrency:
  group: llvm-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            host: linux-x64
          - runner: ubuntu-24.04-arm
            host: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create explicit Debian 12 maintainer toolchain
        run: |
          docker build -f docker/Dockerfile.native-maintainer -t aug-llvm-maintainer .
          docker run -d --cap-add SYS_PTRACE --name qualification aug-llvm-maintainer sleep infinity
      - name: Build and inspect the runtime and compiler pack
        run: |
          docker exec qualification node scripts/bootstrap-native.mjs
          docker exec qualification node scripts/prepare-llvm-tools.mjs
          docker exec qualification node scripts/prepare-llvm-maintainer.mjs
          docker exec qualification node scripts/build-runtime-pack.mjs
          docker exec qualification node scripts/build-llvm-pack.mjs
      - name: Check LLVM language, web, ownership and ABI parity
        run: |
          docker exec qualification npm run check
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_BIND_CLANG=/work/.aug-build/llvm-maintainer/bin/clang -e AUG_REQUIRE_NATIVE_HEADER=1 qualification npm run test:compatibility
          docker exec -e AUG_GITHUB_TOKEN -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_REQUIRE_DWARF=1 -e AUG_REQUIRE_DEBUGGER=1 -e AUG_DWARF_TOOL=/work/.aug-build/llvm-maintainer/bin/llvm-dwarfdump qualification node scripts/check-llvm-parity.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools qualification node --test tests/llvm-native-boundaries.test.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang qualification node scripts/sanitize-core.mjs --backend llvm
      - name: Check independent language contracts and worker races
        run: |
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools qualification npm run test:conformance
          docker exec -e AUG_WORKER_SANITIZER=thread -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang qualification node --test tests/worker-runtime.test.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools qualification node --test tests/ingestion-values.test.mjs tests/http-reception.test.mjs
          docker exec -e AUG_TEST_BACKEND=c qualification node --test tests/ingestion-values.test.mjs
          docker exec -e AUG_WORKER_SANITIZER=address,undefined -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang qualification node --test tests/worker-runtime.test.mjs
      - name: Qualify repeated runtime lifecycles and sustained heap use
        env:
          RELIABILITY_PROFILE: ${{ inputs.reliability_profile || (github.head_ref == 'codex/v1-release-candidate' && 'soak') || 'ci' }}
        run: |
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang qualification node --test tests/runtime-reliability.test.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang qualification npm run test:reliability -- --profile "$RELIABILITY_PROFILE"
      - name: Build real native libraries from separate repositories
        run: |
          for library in pytorch sqlite zlib blake3; do
            revision=$(node --input-type=module -e 'import fs from "node:fs"; const pins=JSON.parse(fs.readFileSync("native/library-qualification.json")); console.log(pins.targets[process.argv[1]][process.argv[2]].commit);' '${{ matrix.host }}' "$library")
            git clone --no-checkout "https://github.com/GreenPandaStudios/aug-$library" "$RUNNER_TEMP/aug-$library"
            git -C "$RUNNER_TEMP/aug-$library" checkout --detach "$revision"
            docker cp "$RUNNER_TEMP/aug-$library" "qualification:/work/aug-$library"
            docker exec qualification node bin/aug.mjs bind header "/work/aug-$library/native/include/$(case "$library" in pytorch) echo aug_torch.h;; *) echo "aug_$library.h";; esac)" --contract "/work/aug-$library/native.abi.json" --target "$(case '${{ matrix.host }}' in linux-x64) echo x86_64-unknown-linux-gnu;; *) echo aarch64-unknown-linux-gnu;; esac)" --clang clang --output "/work/.aug-build/header-check-$library"
            docker exec qualification node "/work/aug-$library/native/build.mjs"
          done
      - name: Qualify the native PostgreSQL package and HTTP drain
        run: |
          git clone --no-checkout https://github.com/GreenPandaStudios/aug-postgres "$RUNNER_TEMP/aug-postgres"
          git -C "$RUNNER_TEMP/aug-postgres" checkout --detach a92850a5f9fc0dd04e952d95bfb17e7281586a60
          docker cp "$RUNNER_TEMP/aug-postgres" qualification:/work/aug-postgres
          docker exec qualification node bin/aug.mjs bind header /work/aug-postgres/native/include/aug_postgres.h --contract /work/aug-postgres/native.abi.json --target "$(case '${{ matrix.host }}' in linux-x64) echo x86_64-unknown-linux-gnu;; *) echo aarch64-unknown-linux-gnu;; esac)" --clang clang --output /work/.aug-build/header-check-postgres
          docker exec qualification chown -R node:node /work/aug-postgres
          docker exec -u node qualification node /work/aug-postgres/native/build.mjs
          docker exec -u node -e AUG_NATIVE_ARTIFACT_CACHE="/work/aug-postgres/.aug-build/native-${{ matrix.host }}/consumer-cache" qualification node bin/aug.mjs package cache-native /work/aug-postgres --artifact "${{ matrix.host }}" --archive "/work/aug-postgres/.aug-build/native-${{ matrix.host }}/native-${{ matrix.host }}.tar.gz"
          docker exec -u node -e AUG_CLI=/work/bin/aug.mjs -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_RUNTIME_PACK=/work/.aug-native/llvm/runtime -e AUG_NATIVE_HOME=/work/.aug-native qualification node /work/aug-postgres/native/ci-server.mjs
      - name: Qualify LLVM performance against the C reference
        run: |
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools qualification node scripts/benchmark-suite.mjs --backend llvm --compare-c-backend --iterations 60 --warmup 3 --http-rounds 5 --http-requests 5000 --output /work/.aug-build/llvm-migration-performance.json
          docker exec qualification node scripts/check-llvm-performance.mjs .aug-build/llvm-migration-performance.json
      - name: Qualify safety gyms and expanded C comparisons
        run: |
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang qualification node scripts/run-gyms.mjs --profile full --vectors 256
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools qualification node scripts/benchmark-kernels.mjs --iterations 30
      - name: Qualify installed CLI against the exact local candidates
        run: |
          docker exec qualification npm run package:packages
          docker exec -e AUG_GITHUB_TOKEN qualification node scripts/qualify-native-consumers.mjs --local-compiler --candidate-libraries /work
      - name: Qualify public repository imports without development tools
        run: |
          docker build -f docker/Dockerfile.native-consumer -t aug-llvm-consumer .
          docker run -d --name public-consumer aug-llvm-consumer sleep infinity
          mkdir -p .aug-build/public-consumer/{dist,examples,native,scripts,.aug-build}
          docker cp qualification:/work/dist/release .aug-build/public-consumer/dist/release
          docker cp "qualification:/work/.aug-build/aug-llvm-${{ matrix.host }}.tar.gz" .aug-build/public-consumer/.aug-build/
          cp scripts/qualify-native-consumers.mjs scripts/qualify-workers.mjs scripts/native-qualification-pins.mjs scripts/qualify-cli-upgrade.mjs scripts/distribution-baseline.mjs scripts/distribution-inputs.json .aug-build/public-consumer/scripts/
          cp native/library-qualification.json .aug-build/public-consumer/native/
          for library in pytorch sqlite zlib blake3; do
            mkdir -p ".aug-build/public-consumer/examples/native-$library"
            cp "examples/native-$library/"*.aug ".aug-build/public-consumer/examples/native-$library/"
          done
          docker cp .aug-build/public-consumer/. public-consumer:/consumer/
          docker exec public-consumer sh -c 'for tool in clang gcc git; do if command -v "$tool"; then exit 1; fi; done; test ! -d /usr/include; test ! -d /usr/local/include'
          docker exec -e AUG_GITHUB_TOKEN public-consumer node scripts/qualify-native-consumers.mjs --local-compiler --discard-builds
          docker exec -e AUG_GITHUB_TOKEN public-consumer node scripts/qualify-workers.mjs --local-compiler
          docker exec -e AUG_GITHUB_TOKEN public-consumer node scripts/qualify-cli-upgrade.mjs --local-compiler
      - name: Collect measured candidates and qualification evidence
        if: always()
        run: |
          mkdir -p .aug-build/linux-evidence
          docker cp qualification:/work/.aug-build/native-consumer-qualification.json .aug-build/linux-evidence/qualification.json || true
          docker cp "qualification:/work/aug-postgres/.aug-build/native-${{ matrix.host }}/qualification.json" .aug-build/linux-evidence/postgres-qualification.json || true
          docker cp "qualification:/work/aug-postgres/.aug-build/native-${{ matrix.host }}/candidate.json" .aug-build/linux-evidence/postgres-candidate.json || true
          docker cp public-consumer:/consumer/.aug-build/native-consumer-qualification.json .aug-build/linux-evidence/public-clean-qualification.json || true
          docker cp public-consumer:/consumer/.aug-build/worker-consumer-qualification.json .aug-build/linux-evidence/ || true
          docker cp "public-consumer:/consumer/.aug-build/cli-upgrade-qualification-${{ matrix.host }}.json" .aug-build/linux-evidence/ || true
          docker cp qualification:/work/.aug-build/runtime-reliability .aug-build/linux-evidence/ || true
          docker cp qualification:/work/.aug-build/language-conformance.json .aug-build/linux-evidence/ || true
          docker cp qualification:/work/.aug-build/llvm-migration-performance.json .aug-build/linux-evidence/ || true
          docker cp qualification:/work/.aug-build/kernels/results.json .aug-build/linux-evidence/kernels.json || true
          docker cp qualification:/work/.aug-build/gyms/results.json .aug-build/linux-evidence/gyms.json || true
          docker cp "qualification:/work/.aug-build/compiler-pack-${{ matrix.host }}.json" .aug-build/linux-evidence/ || true
          docker cp "qualification:/work/.aug-build/aug-llvm-${{ matrix.host }}.tar.gz" .aug-build/linux-evidence/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: llvm-${{ matrix.host }}-candidate
          include-hidden-files: true
          path: .aug-build/linux-evidence
          if-no-files-found: error
