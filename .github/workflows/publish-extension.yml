name: Publish VS Code extension
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag; select the same tag as the workflow ref
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: marketplace-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download and verify published VSIX
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/download-release.mjs extension release
          node scripts/publish-extension.mjs release --verify-only
      - name: Prepare locked publishing tool without lifecycle scripts
        run: |
          npm --prefix vscode ci --ignore-scripts
          npm --prefix vscode audit
          tar -czf release/vsce-tooling.tar.gz -C vscode node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marketplace-release
          path: release/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: marketplace-release
          path: release
      - name: Restore publishing tool
        run: tar -xzf release/vsce-tooling.tar.gz -C vscode
      - name: Publish verified VSIX using Marketplace OIDC
        run: node scripts/publish-extension.mjs release
