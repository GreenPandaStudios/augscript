name: Publish VS Code extension
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: marketplace-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download the reviewed release VSIX
        run: |
          node scripts/version.mjs --check --tag "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$RELEASE_TAG" --pattern "augscript-${RELEASE_TAG#v}.vsix" --pattern SHA256SUMS --dir release
      - name: Verify the VSIX checksum and identity
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, zipfile
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          filename = f'augscript-{version}.vsix'
          archive = pathlib.Path('release') / filename
          checksums = dict(line.split('  ', 1)[::-1] for line in pathlib.Path('release/SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksums[filename], 'VSIX checksum mismatch'
          with zipfile.ZipFile(archive) as package:
              manifest = json.loads(package.read('extension/package.json'))
          assert manifest['version'] == version, 'VSIX version mismatch'
          assert manifest['publisher'] == 'augscript' and manifest['name'] == 'augscript', 'VSIX identity mismatch'
          PYTHON
      - run: npm --prefix vscode ci --ignore-scripts
      - name: Authenticate the Marketplace publisher
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the verified VSIX
        run: vscode/node_modules/.bin/vsce publish --packagePath "release/augscript-${RELEASE_TAG#v}.vsix" --azure-credential
