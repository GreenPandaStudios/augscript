name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler-packs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: darwin-arm64
            artifact: macos-arm64
          - runner: ubuntu-24.04
            host: linux-x64
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            host: linux-arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'macOS'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify macOS compiler pack
        if: runner.os == 'macOS'
        run: |
          npm ci
          node scripts/bootstrap-native.mjs
          node scripts/prepare-llvm-tools.mjs
          node scripts/prepare-llvm-maintainer.mjs
          node scripts/build-runtime-pack.mjs
          AUG_LLVM_HOME="$PWD/.aug-build/llvm-tools" AUG_REQUIRE_DWARF=1 AUG_REQUIRE_DEBUGGER=1 node scripts/check-llvm-parity.mjs
          AUG_LLVM_HOME="$PWD/.aug-build/llvm-tools" AUG_SANITIZER_CC="$PWD/.aug-build/llvm-maintainer/bin/clang" node scripts/sanitize-core.mjs --backend llvm
          node scripts/build-llvm-pack.mjs
          AUG_LLVM_HOME="$PWD/.aug-build/llvm-tools" node scripts/benchmark-suite.mjs --backend llvm --compare-c-backend --iterations 60 --warmup 3 --http-rounds 5 --http-requests 5000 --output .aug-build/llvm-migration-performance.json
          node scripts/check-llvm-performance.mjs .aug-build/llvm-migration-performance.json
          AUG_LLVM_HOME="$PWD/.aug-build/llvm-tools" AUG_SANITIZER_CC="$PWD/.aug-build/llvm-maintainer/bin/clang" node scripts/run-gyms.mjs --profile full --vectors 256
          AUG_LLVM_HOME="$PWD/.aug-build/llvm-tools" node scripts/benchmark-kernels.mjs --iterations 30
      - name: Build and verify Linux compiler pack on Debian 12
        if: runner.os == 'Linux'
        run: |
          docker build -f docker/Dockerfile.native-maintainer -t aug-llvm-maintainer .
          docker run -d --cap-add SYS_PTRACE --name producer aug-llvm-maintainer sleep infinity
          docker exec producer node scripts/bootstrap-native.mjs
          docker exec producer node scripts/prepare-llvm-tools.mjs
          docker exec producer node scripts/prepare-llvm-maintainer.mjs
          docker exec producer node scripts/build-runtime-pack.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_REQUIRE_DWARF=1 -e AUG_REQUIRE_DEBUGGER=1 -e AUG_DWARF_TOOL=/work/.aug-build/llvm-maintainer/bin/llvm-dwarfdump producer node scripts/check-llvm-parity.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang producer node scripts/sanitize-core.mjs --backend llvm
          docker exec producer node scripts/build-llvm-pack.mjs
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools producer node scripts/benchmark-suite.mjs --backend llvm --compare-c-backend --iterations 60 --warmup 3 --http-rounds 5 --http-requests 5000 --output /work/.aug-build/llvm-migration-performance.json
          docker exec producer node scripts/check-llvm-performance.mjs .aug-build/llvm-migration-performance.json
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools -e AUG_SANITIZER_CC=/work/.aug-build/llvm-maintainer/bin/clang producer node scripts/run-gyms.mjs --profile full --vectors 256
          docker exec -e AUG_LLVM_HOME=/work/.aug-build/llvm-tools producer node scripts/benchmark-kernels.mjs --iterations 30
          mkdir -p .aug-build
          docker cp "producer:/work/.aug-build/aug-llvm-${{ matrix.artifact }}.tar.gz" .aug-build/
          docker cp "producer:/work/.aug-build/compiler-pack-${{ matrix.host }}.json" .aug-build/
          docker cp producer:/work/.aug-build/llvm-migration-performance.json .aug-build/
          mkdir -p .aug-build/kernels .aug-build/gyms
          docker cp producer:/work/.aug-build/kernels/results.json .aug-build/kernels/
          docker cp producer:/work/.aug-build/gyms/results.json .aug-build/gyms/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compiler-pack-${{ matrix.host }}
          include-hidden-files: true
          path: |
            .aug-build/aug-llvm-${{ matrix.artifact }}.tar.gz
            .aug-build/compiler-pack-${{ matrix.host }}.json
            .aug-build/llvm-migration-performance.json
            .aug-build/kernels/results.json
            .aug-build/gyms/results.json
          if-no-files-found: error
  release:
    needs: compiler-packs
    runs-on: macos-15
    timeout-minutes: 60
    env:
      AUG_LLVM_HOME: ${{ github.workspace }}/.aug-build/llvm-tools
      AUG_RELEASE_NATIVE_REQUIRED: '1'
      AUG_GITHUB_TOKEN: ${{ github.token }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm --prefix vscode ci
      - run: node scripts/version.mjs --check --tag "$GITHUB_REF_NAME"
      - run: node scripts/bootstrap-native.mjs
      - run: node scripts/prepare-llvm-tools.mjs
      - run: node scripts/prepare-llvm-maintainer.mjs
      - run: node scripts/build-runtime-pack.mjs
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: compiler-pack-*
          path: .aug-build/release-packs
      - name: Pin every qualified platform before packing npm and VSIX
        run: node scripts/merge-compiler-packs.mjs .aug-build/release-packs
      - run: npm run check
      - run: npm test
      - name: LLVM language, runtime and real application parity
        env:
          AUG_REQUIRE_DWARF: '1'
          AUG_REQUIRE_DEBUGGER: '1'
        run: node scripts/check-llvm-parity.mjs
      - name: LLVM address and runtime undefined-behavior sanitizer gate
        env:
          AUG_SANITIZER_CC: ${{ github.workspace }}/.aug-build/llvm-maintainer/bin/clang
        run: node scripts/sanitize-core.mjs --backend llvm
      - run: npm run docs:check
      - run: npm run docs:build
      - run: npm run package:packages
      - run: npm run test:packages -- --native
      - name: Qualify cold public native imports from the installed CLI
        run: node scripts/qualify-native-consumers.mjs --local-compiler
      - run: npm run package:extension
      - run: node scripts/release-artifacts.mjs
      - name: Verify the artifacts consumed by publishing workflows
        run: |
          node scripts/publish-release.mjs dist/release --verify-only
          node scripts/publish-extension.mjs dist/release --verify-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-release
          path: dist/release/*
          if-no-files-found: error
  consumers:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            host: darwin-arm64
            artifact: macos-arm64
          - runner: ubuntu-24.04
            host: linux-x64
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            host: linux-arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      AUG_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'macOS'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: reviewed-release
          path: dist/release
      - name: Select the exact release compiler archive
        run: |
          mkdir -p .aug-build
          cp "dist/release/aug-llvm-${{ matrix.artifact }}.tar.gz" .aug-build/
      - name: Qualify macOS 14 with developer tools physically absent
        if: runner.os == 'macOS'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /Applications/Xcode*.app /Library/Developer/CommandLineTools
          ! xcrun --show-sdk-path
          node scripts/qualify-native-consumers.mjs --local-compiler
      - name: Qualify Linux in a clean runtime image
        if: runner.os == 'Linux'
        run: |
          docker build -f docker/Dockerfile.native-consumer -t aug-llvm-consumer .
          docker run -d --name consumer aug-llvm-consumer sleep infinity
          docker exec consumer sh -c '! command -v clang; ! command -v gcc; ! command -v git; test ! -d /usr/include; test ! -d /usr/local/include'
          docker exec consumer node -e 'for(const name of ["scripts","native","dist","examples",".aug-build"])require("node:fs").mkdirSync("/consumer/"+name,{recursive:true})'
          docker cp scripts/qualify-native-consumers.mjs consumer:/consumer/scripts/
          docker cp scripts/native-qualification-pins.mjs consumer:/consumer/scripts/
          docker cp native/library-qualification.json consumer:/consumer/native/
          docker cp dist/release consumer:/consumer/dist/
          docker cp examples/. consumer:/consumer/examples/
          docker cp ".aug-build/aug-llvm-${{ matrix.artifact }}.tar.gz" consumer:/consumer/.aug-build/
          docker exec -e AUG_GITHUB_TOKEN consumer node scripts/qualify-native-consumers.mjs --local-compiler
          docker cp consumer:/consumer/.aug-build/native-consumer-qualification.json .aug-build/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-consumer-${{ matrix.host }}
          include-hidden-files: true
          path: .aug-build/native-consumer-qualification.json
          if-no-files-found: error
  draft:
    needs: [release, consumers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: reviewed-release
          path: dist/release
      - name: Upload draft prerelease after all consumer gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --draft --prerelease --verify-tag --title "August $GITHUB_REF_NAME" --notes-file CHANGELOG.md
