name: Extract release review files
on:
  workflow_dispatch:
    inputs:
      run:
        description: Successful Prepare release run ID
        type: string
        required: true
      tag:
        description: Immutable compiler release tag
        type: string
        required: true
      commit:
        description: Reviewed full source commit SHA
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_RUN: ${{ inputs.run }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the successful source run
        run: |
          [[ "$RELEASE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/GreenPandaStudios/augscript/actions/runs/$RELEASE_RUN" > run.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFileSync} from "node:fs";
            const run=JSON.parse(readFileSync("run.json"));
            assert.equal(run.repository.full_name,"GreenPandaStudios/augscript");
            assert.equal(run.head_sha,process.env.RELEASE_COMMIT);
            assert.equal(run.path,".github/workflows/release.yml");
            assert.equal(run.status,"completed");
            assert.equal(run.conclusion,"success");
          '
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the immutable release tag
        run: node scripts/release-source.mjs "$RELEASE_TAG" "$RELEASE_COMMIT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: reviewed-release
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
          path: review
      - name: Verify npm and extension archives and contracts
        run: |
          npm ci --ignore-scripts
          node scripts/publish-release.mjs review --verify-only
          node scripts/publish-extension.mjs review --verify-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-client-packages
          path: |
            review/*.tgz
            review/*.vsix
            review/augscript-docs-*.tar.gz
            review/packages.json
            review/compiler-packs.json
            review/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
