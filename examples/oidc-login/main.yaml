block_style: indent
web:
  host: 127.0.0.1
  body_limit: 16384
  response_limit: 1048576
openapi:
  enabled: true
  title: August OpenID Connect demo
  version: 0.1.0
  path: /openapi.json
  docs: /docs
  output: .aug-build/openapi.json

packages:
